<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>할 일 목록 앱</title>
    <!-- Tailwind CSS를 CDN으로 로드 (인터넷 필요) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen py-8 px-4">
    <div class="max-w-2xl mx-auto">
        <!-- 제목 -->
        <h1 class="text-4xl font-bold text-gray-800 mb-8 text-center">
            ✅ 내 할 일 목록
        </h1>

        <!-- 입력 영역을 감싸는 카드 -->
        <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
            <!-- 할 일 입력 필드와 버튼 -->
            <div class="flex gap-2">
                <!-- 할 일을 입력하는 텍스트 필드 -->
                <input
                    type="text"
                    id="todoInput"
                    placeholder="새로운 할 일을 입력하세요..."
                    class="flex-1 px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 transition"
                >
                <!-- 할 일 추가 버튼 -->
                <button
                    id="addBtn"
                    class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold transition transform hover:scale-105"
                >
                    추가
                </button>
            </div>
        </div>

        <!-- 할 일 목록을 표시하는 영역 -->
        <div id="todoList" class="space-y-2">
            <!-- JavaScript에서 할 일을 여기에 추가합니다 -->
        </div>

        <!-- 목록이 비어있을 때 표시되는 메시지 -->
        <div id="emptyMessage" class="text-center py-12">
            <p class="text-gray-400 text-lg">아직 할 일이 없습니다. 새로운 일을 추가해보세요! 🎯</p>
        </div>
    </div>

    <script>
        // 할 일 목록 데이터를 저장하는 배열
        let todos = [];
        // 각 할 일에 고유한 번호를 매기기 위한 변수
        let todoId = 0;

        // HTML에서 필요한 요소들을 가져오기
        const todoInput = document.getElementById('todoInput');
        const addBtn = document.getElementById('addBtn');
        const todoList = document.getElementById('todoList');
        const emptyMessage = document.getElementById('emptyMessage');

        // 추가 버튼을 눌렀을 때 실행되는 함수
        addBtn.addEventListener('click', addTodo);

        // Enter 키를 눌렀을 때도 할 일이 추가되도록 설정
        todoInput.addEventListener('keypress', (event) => {
            if (event.key === 'Enter') {
                addTodo();
            }
        });

        // 새로운 할 일을 추가하는 함수
        function addTodo() {
            // 입력 필드에서 텍스트 가져오기 (앞뒤 공백 제거)
            const text = todoInput.value.trim();

            // 입력이 비어있으면 함수를 멈춤
            if (text === '') {
                alert('할 일을 입력해주세요!');
                return;
            }

            // 새로운 할 일 객체 만들기
            const newTodo = {
                id: todoId++,           // 고유한 번호 부여
                text: text,             // 할 일 내용
                completed: false        // 완료 여부 (처음에는 false)
            };

            // 배열에 새로운 할 일 추가
            todos.push(newTodo);

            // 입력 필드 비우기
            todoInput.value = '';
            // 입력 필드에 포커스 유지 (다시 입력할 수 있게)
            todoInput.focus();

            // 화면에 업데이트하기
            renderTodos();
        }

        // 할 일을 완료/미완료로 표시하는 함수
        function toggleTodo(id) {
            // 해당 아이디의 할 일을 찾아서 완료 상태 뒤집기
            const todo = todos.find(t => t.id === id);
            if (todo) {
                todo.completed = !todo.completed; // true → false, false → true로 변환
            }

            // 화면에 업데이트하기
            renderTodos();
        }

        // 할 일을 삭제하는 함수
        function deleteTodo(id) {
            // 특정 아이디를 제외한 모든 할 일만 남기기 (필터링)
            todos = todos.filter(t => t.id !== id);

            // 화면에 업데이트하기
            renderTodos();
        }

        // 할 일 목록을 화면에 그리는 함수
        function renderTodos() {
            // 목록 영역 비우기 (기존 내용 제거)
            todoList.innerHTML = '';

            // 배열의 각 할 일에 대해 반복 실행
            todos.forEach(todo => {
                // 새로운 할 일 항목 만들기 (div 요소)
                const todoItem = document.createElement('div');

                // 카드 스타일 적용 (Tailwind CSS 클래스 사용)
                todoItem.className = `
                    bg-white rounded-lg shadow-md p-4
                    flex items-center gap-4
                    hover:shadow-lg transition transform hover:-translate-y-1
                    border-l-4 ${todo.completed ? 'border-green-500' : 'border-blue-500'}
                `;

                // 할 일 내용 HTML 만들기
                todoItem.innerHTML = `
                    <!-- 체크박스 -->
                    <input
                        type="checkbox"
                        ${todo.completed ? 'checked' : ''}
                        onchange="toggleTodo(${todo.id})"
                        class="w-5 h-5 text-blue-500 rounded cursor-pointer"
                    >

                    <!-- 할 일 텍스트 (체크되면 줄이 그어짐) -->
                    <span class="flex-1 text-lg ${todo.completed ? 'line-through text-gray-400' : 'text-gray-800'}">
                        ${todo.text}
                    </span>

                    <!-- 삭제 버튼 -->
                    <button
                        onclick="deleteTodo(${todo.id})"
                        class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded text-sm font-semibold transition"
                    >
                        삭제
                    </button>
                `;

                // 만들어진 항목을 목록에 추가
                todoList.appendChild(todoItem);
            });

            // 할 일이 없으면 안내 메시지 표시, 있으면 숨기기
            emptyMessage.style.display = todos.length === 0 ? 'block' : 'none';
        }

        // 처음 페이지 로드될 때 빈 목록 표시
        renderTodos();
    </script>
</body>
</html>
